format = """
$env_var\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character"""
# Inserts a blank line between shell prompts.
add_newline = false

# Timeout for commands (in milliseconds).
command_timeout = 1000

[directory]
truncation_length = 0
truncate_to_repo = false
style = "bold"  # whatever you want

[character]
success_symbol = '[λ](bold)'
error_symbol = "[λ](bold)"

[git_status]
disabled = false

[git_branch]
symbol = ' '

[package]
disabled = true
