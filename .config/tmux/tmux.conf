set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g prefix C-f
unbind C-b
bind C-f send-prefi

# Reduce escape time for faster neovim response
set -sg escape-time 10

# Focus events enabled for better vim/nvim integration
set-option -g focus-events on

set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Pane navigation
bind -n C-Left select-pane -L
bind -n C-Up select-pane -D
bind -n C-Down select-pane -U
bind -n C-Right select-pane -R

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Move between buffers
bind -n S-Left  previous-window
bind -n S-Right next-window

# horizontal on prefix + h
bind h split-window -h

# vertical on prefix + v
bind v split-window -v

bind -r , last-window
# Reloading config
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Let terminal (foot) handle clipboard
set -g set-clipboard external

# Allow foot to handle Ctrl+Shift+C/V for copy/paste
# Unbind any tmux bindings that might interfere
unbind -n C-S-c
unbind -n C-S-v

# Increase scrollback buffer
set -g history-limit 50000

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# Bar bg/fg
set -g status-style 'bg=#1e1e1e fg=#888888'

# Left: session name
set -g status-left-length 20
set -g status-left '#[fg=#555555,bold] #S #[fg=#333333]│ '

# Right: host · cwd · time
set -g status-right-length 60
set -g status-right '#[fg=#555555]#H #[fg=#333333]│ #[fg=#555555]#{b:pane_current_path} #[fg=#333333]│ #[fg=#666666]%H:%M '

# Windows
set -g window-status-format         '#[fg=#555555] #I #W '
set -g window-status-current-format '#[fg=#c0c0c0,bg=#2a2a2a] #I #W '
set -g window-status-separator      ''

# Pane borders
set -g pane-border-style        'fg=#2a2a2a'
set -g pane-active-border-style 'fg=#555555'

# Message bar
set -g message-style 'bg=#2a2a2a fg=#c0c0c0'
